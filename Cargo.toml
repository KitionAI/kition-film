[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "tools/xtask"]
default-members = ["crates/*/*", "bindings/headless", "tools/xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/KitionAI/kition-film"

[workspace.dependencies]
# kition-sdk, pinned by commit (one revision for every crate of it)
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "628dbac9bd7dd0b21513df3ea127bf575de373c1" }
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "628dbac9bd7dd0b21513df3ea127bf575de373c1" }
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "628dbac9bd7dd0b21513df3ea127bf575de373c1" }
# A host of kit processes (`HeadlessKit`), for the `document.identity` tests.
kition-kit-host = { git = "https://github.com/KitionAI/kition-sdk", rev = "628dbac9bd7dd0b21513df3ea127bf575de373c1" }
# The kits' MCP server's tools (kition-kits-mcp), for the headless kit's end-to-end tests.
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "628dbac9bd7dd0b21513df3ea127bf575de373c1" }

# internal
kition-film-time = { path = "crates/media/time" }
kition-film-geom = { path = "crates/support/geom" }
kition-film-color = { path = "crates/support/color" }
kition-film-bitstream = { path = "crates/media/bitstream" }
kition-film-isobmff = { path = "crates/media/isobmff" }
kition-film-matroska = { path = "crates/media/matroska" }
kition-film-mxf = { path = "crates/media/mxf" }
kition-film-cfb = { path = "crates/formats/cfb" }
kition-film-mpegts = { path = "crates/media/mpegts" }
kition-film-mpeg2v = { path = "crates/media/mpeg2v" }
kition-film-ac3 = { path = "crates/media/ac3" }
kition-film-ogg = { path = "crates/media/ogg" }
kition-film-h264 = { path = "crates/media/h264" }
kition-film-hevc = { path = "crates/media/hevc" }
kition-film-vp9 = { path = "crates/media/vp9" }
kition-film-prores = { path = "crates/media/prores" }
kition-film-dnx = { path = "crates/media/dnx" }
kition-film-apv = { path = "crates/media/apv" }
kition-film-av1 = { path = "crates/media/av1" }
kition-film-aac = { path = "crates/media/aac" }
kition-film-opus = { path = "crates/media/opus" }
kition-film-h264enc = { path = "crates/media/h264enc" }
kition-film-audio-dsp = { path = "crates/engine/audio-dsp" }
kition-film-frame = { path = "crates/media/frame" }
kition-film-media = { path = "crates/media/media" }
kition-film-codecs = { path = "crates/media/codecs" }
kition-film-project = { path = "crates/engine/project" }
kition-film-edit = { path = "crates/engine/edit" }
kition-film-interchange = { path = "crates/formats/interchange" }
kition-film-text = { path = "crates/support/text" }
kition-film-captions = { path = "crates/engine/captions" }
kition-film-speech = { path = "crates/engine/speech" }
kition-film-render = { path = "crates/render/render" }
kition-film-scopes = { path = "crates/engine/scopes" }
kition-film-export = { path = "crates/formats/export" }
kition-film-format = { path = "crates/formats/format" }
kition-film-engine = { path = "crates/engine/engine" }
kition-film-testkit = { path = "crates/support/testkit" }
kdm-model = { path = "crates/kdm/kdm-model" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
roxmltree = "0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

# Debug info: line tables for the kit's crates (backtraces keep file and line) and none for
# dependencies. Full debug info in each of the ~300 test binaries filled a GitHub runner's disk
# during `cargo test --workspace`.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.kition-film-h264]
opt-level = 3

[profile.dev.package.kition-film-h264enc]
opt-level = 3

[profile.dev.package.kition-film-hevc]
opt-level = 3

[profile.dev.package.kition-film-prores]
opt-level = 3

[profile.dev.package.kition-film-dnx]
opt-level = 3

[profile.dev.package.kition-film-apv]
opt-level = 3

[profile.dev.package.kition-film-av1]
opt-level = 3

[profile.dev.package.kition-film-aac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.kition-film-audio-dsp]
opt-level = 3

[profile.dev.package.kition-film-mxf]
opt-level = 3

[profile.dev.package.kition-film-opus]
opt-level = 3

[profile.dev.package.kition-film-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <title>Film kit: development host</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      /* A fixed height, so the editor's frame is the same size in every browser on every system (a file input's own height differs between them). */
      header { display: flex; flex: none; gap: 8px; align-items: center; box-sizing: border-box; height: 32px; padding: 0 12px; overflow: hidden; white-space: nowrap; border-bottom: 1px solid #e5e3df; font-size: 13px; }
      header input { font-size: 12px; }
      iframe { flex: 1; border: 0; }
    </style>
  </head>
  <body>
    <header><strong>Development host</strong><span id="status">opening…</span><span style="flex: 1"></span><input id="file" type="file" accept=".kfilm,.prproj,.mp4,.mov" /></header>
    <iframe id="kit" src="about:blank" allow="fullscreen; clipboard-read; clipboard-write" title="Film"></iframe>
    <script type="module" src="./src/devHost.ts"></script>
  </body>
</html>

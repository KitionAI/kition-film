name: Film scenarios

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: film-scenarios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KITION_FILM_REQUIRE_ORACLES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: kition-film
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-film -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: kition-film/web/pnpm-lock.yaml
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Install external media test oracles
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked dependencies
        run: pnpm --dir kition-film/web install --frozen-lockfile
      - name: Build current WASM
        run: pnpm --dir kition-film/web engine
      - name: Install browsers
        run: pnpm --dir kition-film/web exec playwright install --with-deps chromium webkit
      - name: PR gate
        if: github.event_name == 'pull_request'
        run: pnpm --dir kition-film/web test:ci
      - name: Full regression
        if: github.event_name != 'pull_request'
        run: pnpm --dir kition-film/web test:ci:full
      - name: Upload results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-scenarios-${{ github.run_id }}
          path: |
            kition-film/web/test-results/
            kition-film/web/playwright-report/
          retention-days: 14
          if-no-files-found: warn

name: Film scenarios

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: film-scenarios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-24.04
    # Setup (WASM build, browsers) takes about 30 minutes and the Rust workspace tests about 40;
    # the browser scenarios (both engines), modes and flows run after them.
    timeout-minutes: 240
    env:
      KITION_FILM_REQUIRE_ORACLES: '1'
      # The full regression builds every crate and test with clippy and cargo test; full debug
      # info filled the runner's disk. Line tables keep panic backtraces readable.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          path: kition-film
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kition-film -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: kition-film/web/pnpm-lock.yaml
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      # The oracle tests are kept green against FFmpeg 9.0; Ubuntu 24.04's ffmpeg (6.1) has no APV
      # support and differs in other fixtures. A pinned static build, checked against its digest.
      - name: Install external media test oracles (FFmpeg 9.0.2)
        env:
          FFMPEG_BUILD: ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-gpl-9.0
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-gpl-9.0.tar.xz
          FFMPEG_SHA256: 73e29a56974ae5a651133a04584c7483b21afe941e17dc91d79814a758b608d3
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/ffmpeg.tar.xz"
          bin="$RUNNER_TEMP/$FFMPEG_BUILD/bin"
          echo "$bin" >> "$GITHUB_PATH"
          echo "KITION_FILM_FFMPEG=$bin/ffmpeg" >> "$GITHUB_ENV"
          echo "KITION_FILM_FFPROBE=$bin/ffprobe" >> "$GITHUB_ENV"
          "$bin/ffmpeg" -hide_banner -version | head -1
          "$bin/ffprobe" -hide_banner -version | head -1
      - name: Install locked dependencies
        run: pnpm --dir kition-film/web install --frozen-lockfile
      - name: Build current WASM
        run: pnpm --dir kition-film/web engine
      - name: Install browsers
        run: pnpm --dir kition-film/web exec playwright install --with-deps chromium webkit
      - name: PR gate
        if: github.event_name == 'pull_request'
        run: pnpm --dir kition-film/web test:ci
      - name: Full regression
        if: github.event_name != 'pull_request'
        run: pnpm --dir kition-film/web test:ci:full
      - name: Disk usage
        if: always()
        run: df -h / && du -sh kition-film/target || true
      - name: Upload results and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-scenarios-${{ github.run_id }}
          path: |
            kition-film/web/test-results/
            kition-film/web/playwright-report/
          retention-days: 14
          if-no-files-found: warn

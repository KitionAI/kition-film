[package]
name = "kition-film-kit"
description = "The Film engine for Kition's in-page editor: open, play, edit, and save Kition Film projects from JavaScript (WebAssembly), on the Kition SDK."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
kition-kit = { workspace = true, features = ["session"] }
kdm-model = { workspace = true }
kition-film-audio-dsp = { workspace = true }
kition-film-color = { workspace = true }
kition-film-engine = { workspace = true }
kition-film-format = { workspace = true }
kition-film-frame = { workspace = true }
kition-film-media = { workspace = true }
kition-film-scopes = { workspace = true }
kition-film-time = { workspace = true }
kition-film-text = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The conformance fixture writer (examples/checks.rs) saves its previews.
image = { version = "0.25", default-features = false, features = ["png"] }

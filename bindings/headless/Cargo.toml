[package]
name = "kition-film"
description = "The Film kit for Kition's agent: the Kition SDK document served headless over the Kit Protocol."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
kition-film-kit = { path = "../wasm" }
kition-headless = { workspace = true }

[dev-dependencies]
# workspace_only.rs reads the pictures the kit renders.
image = { version = "0.25", default-features = false, features = ["png"] }
kition-kit-server = { workspace = true }
kition-kit = { workspace = true }
serde_json = { workspace = true }
# outside.rs and ids.rs drive the kit through the kits' MCP server's tools, as an agent does.
kition-kits = { workspace = true }
kition-film-format = { workspace = true }
kition-film-project = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

format: 1
id: film.timeline.transitions/by-hand
feature: film.timeline.transitions
intent: >-
  A person adds and shapes a transition by hand, in WebKit (Kition Desktop's engine on macOS): Cross
  Dissolve dragged from the Effects panel near the cut between two clips shows "Center at Cut"
  and lands centred over the cut, one undo step (before, only Cmd+D added one and nothing could
  touch it); a click selects it (drawn selected, the clips let go); dragging its right end draws it
  longer and lengthens it on release, centred, as one undo step that one undo takes back; a
  double-click opens Set Transition Duration, where 10 frames typed and OK set its length; its menu
  offers Set Transition Duration…; Delete on the selected transition removes it (no clip with it)
  in one undo step, one undo brings it back as it was, and redo removes it again. The whole script
  also runs the Effects panel steps.

id: regressions/issue-shift-delete-ripple
feature: film.editor.no-dead-ends
intent: >-
  Shift+Delete (the key Edit ▸ Ripple Delete shows) and Shift+Backspace (the Mac keyboard's
  shift-delete) with a clip selected and the Timeline focused ripple-delete: the clip goes and the
  clips after it close the gap. Before, the key router took the Timeline's Delete binding (Clear)
  with an extra Shift ahead of the application-wide Shift+Delete, so both keys only cleared and
  left the gap (phase 0 walkthrough, 2026-11-23). Also checked in WebKit, with a real pointer and
  keyboard, together with the rest of the editor's dead ends (regressions/issue-dead-ends).

format: 1
id: regressions/issue-inspect-editor-state
feature: film.agent.context
intent: >-
  What an agent reads of a project served headless (`view.describe`, the film_inspect details) is
  the project, not the editing session: moving the playhead, selecting clips or loading the Source
  monitor leaves it unchanged, while a keyframe's `time` and the title safe area stay. kition-sdk
  stopped leaving out `playhead`- and `selection`-like keys by name, so the kit declares its editor
  state itself (`EDITOR_STATE`, JSON Pointers); the playhead, the selection and the session's path,
  dirty state and revision showed up undeclared.
layer: gate
tags: [headless]
source:
  kind: probe
  from: 'agent context work C4-film (kition-sdk 3e6fc07, "inspect details leave out only declared editor state")'
  license: owned
input: []
steps:
  - cargo-test:
      package: kition-film
      test: context
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0

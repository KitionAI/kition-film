format: 1
id: regressions/issue-resize-observer-loop
feature: film.editor.display-modes
intent: >-
  Laying the editor out raises no page error in WebKit: when the Program monitor's canvas was
  placed inside a ResizeObserver delivery, its first view published the guides' geometry there,
  which re-rendered the editor synchronously and observed the tab strip anew mid-delivery, so
  WebKit reported "ResizeObserver loop completed with undelivered notifications" in Single line
  and in Classic at Kition's editor widths.
layer: gate

format: 1
id: film.monitor.picture-by-hand/two-parameter-drags
feature: film.monitor.picture-by-hand
intent: >-
  On the Program picture, in WebKit (Kition Desktop's engine on macOS), the drags that change two
  Motion parameters are live and one undo step: the anchor point dragged changes Anchor Point while
  it is held, and one undo puts both Anchor Point and Position back; with Uniform Scale off a corner
  handle dragged sideways widens the clip while it is held (Scale Width more than Scale Height),
  and one undo puts both back. Before, these drags showed only an outline and landed on release as
  two undo steps, because effects.setParam merged one parameter's changes only. The whole script
  also runs the other picture steps.

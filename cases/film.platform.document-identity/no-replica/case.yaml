format: 1
id: film.platform.document-identity/no-replica
feature: film.platform.document-identity
intent: >-
  Through the real kition-film process, which lists the feature file.identity: a .kfilm is the
  project as JSON and embeds no replica (the kit makes one under a new id on every open), so a
  saved project, its byte copy and an empty .kfilm carry no identity (docId null); file.fork
  writes the same bytes with no docId to a new file, which opens as the project, leaves the source
  unchanged, and never replaces an existing file (file_conflict).
layer: gate
